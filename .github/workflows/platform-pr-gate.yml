name: Platform PR Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/platform-pr-gate.yml"
      - "apps/api/**"
      - "apps/portal/**"
      - "platform/**"
      - "gitops/**"

permissions:
  contents: read

concurrency:
  group: platform-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-platform:
    name: Validate platform change
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      KUBERNETES_VALIDATION_MODE: client

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.21.3"


      - name: Install API dependencies
        run: |
          python -m pip install \
            --requirement apps/api/requirements.txt

      - name: Check changed files for whitespace errors
        run: |
          git diff --check \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Check Python syntax
        run: |
          python -m py_compile \
            apps/api/app.py \
            apps/api/models.py \
            apps/api/runtime_status.py \
            apps/api/service_creator.py \
            platform/worker/validate_request.py

      - name: Check JavaScript syntax
        run: |
          node --check apps/portal/app.js

      - name: Check Bash syntax
        run: |
          bash -n platform/worker/render_service.sh

      - name: Validate every ServiceRequest
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r request_file
          do
            echo "Validating ${request_file}"

            python -m json.tool \
              "${request_file}" \
              >/dev/null

            python platform/worker/validate_request.py \
              --profiles platform/catalog/resource-profiles.json \
              "${request_file}"
          done < <(
            find platform/requests/services \
              -type f \
              -name config.json \
              -print |
              sort
          )

      - name: Render and compare every GitOps workload
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r request_file
          do
            relative_path="${request_file#platform/requests/services/}"

            service_name="${relative_path%%/*}"

            environment_path="${relative_path#*/}"
            environment="${environment_path%%/*}"

            committed_manifest="gitops/services/${service_name}/${environment}/workload.yaml"

            if [[ ! -f "${committed_manifest}" ]]; then
              echo "Missing generated manifest:"
              echo "  ${committed_manifest}"
              exit 1
            fi

            temporary_manifest="$(mktemp)"

            echo "Rendering ${service_name}/${environment}"

            KUBERNETES_VALIDATION_MODE=client \
              ./platform/worker/render_service.sh \
              "${request_file}" \
              "${temporary_manifest}"

            if ! diff -u \
              "${committed_manifest}" \
              "${temporary_manifest}"
            then
              echo
              echo "Generated manifest is not up to date:"
              echo "  ${committed_manifest}"
              echo
              echo "Run render_service.sh and commit the result."
              rm -f "${temporary_manifest}"
              exit 1
            fi

            rm -f "${temporary_manifest}"
          done < <(
            find platform/requests/services \
              -type f \
              -name config.json \
              -print |
              sort
          )

      - name: PR Gate summary
        run: |
          echo "All platform validation checks passed."
          echo "No deployment was performed."