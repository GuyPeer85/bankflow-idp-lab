apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: guestbook-dev
  namespace: argocd
  labels:
    bankflow.io/environment: dev
    bankflow.io/owner: platform-team

spec:
  project: default

  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true