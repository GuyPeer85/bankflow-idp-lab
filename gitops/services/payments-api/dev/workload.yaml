apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-api
  namespace: dev
  labels:
    app.kubernetes.io/name: payments-api
    bankflow.io/owner: payments-team
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: dev
  labels:
    app.kubernetes.io/name: payments-api
    bankflow.io/owner: payments-team

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
        bankflow.io/owner: payments-team

    spec:
      serviceAccountName: payments-api
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: payments-api
          image: bankflow/payments-api:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: APP_VERSION
              value: "1.0.0"

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: dev
  labels:
    app.kubernetes.io/name: payments-api
    bankflow.io/owner: payments-team

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: payments-api

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP